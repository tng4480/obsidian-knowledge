[project]
name = "acadmem"
version = "0.1.0"
description = "Local semantic retrieval layer over an Obsidian vault (Markdown + PDF), exposed via MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lancedb>=0.25",
    "pyarrow",
    "sentence-transformers>=3.0",
    "markdown-it-py>=3.0",
    "python-frontmatter>=1.1",
    "semchunk>=2.2",
    "watchdog>=4.0",
    "mcp>=1.2",
    "pyyaml>=6.0",
    "pymupdf4llm>=0.0.17",
    "docling>=2.0",
    "filelock>=3.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "reportlab>=4.0",
]

[project.scripts]
acadmem = "acadmem.cli:main"
acadmem-mcp = "acadmem.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acadmem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that load the real embedding model or Docling (deselect with -m 'not slow')",
]
addopts = "-ra"
